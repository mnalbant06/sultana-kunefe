<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Sultana Künefe — Gaziantep · Sivas</title>
  <desc id="logo-desc">Dairesel Sultana Künefe amblemi; sarı ve yeşil çember, ortasında yeşil S ve sarı K harfleri.</desc>
  <defs>
    <clipPath id="badge-circle"><circle cx="180" cy="180" r="145"/></clipPath>
    <path id="name-arc" d="M 54 180 A 126 126 0 0 1 306 180"/>
    <path id="food-arc" d="M 54 181 A 126 126 0 0 0 306 181"/>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".2"/>
    </filter>
  </defs>
  <!-- Silver-white outer medallion rim from the supplied reference -->
  <circle cx="180" cy="180" r="174" fill="#f8f8f5" stroke="#c9c9c5" stroke-width="3" filter="url(#soft-shadow)"/>
  <circle cx="180" cy="180" r="165" fill="none" stroke="#d7d7d3" stroke-width="2"/>
  <circle cx="180" cy="180" r="157" fill="#fff" stroke="#eeeeeb" stroke-width="3"/>
  <!-- Green badge with a golden upper half -->
  <circle cx="180" cy="180" r="145" fill="#54c900" stroke="#deded8" stroke-width="3"/>
  <g clip-path="url(#badge-circle)">
    <path d="M 25 36 H 335 V 180 C 290 207 255 220 180 220 C 105 220 70 207 25 180 Z" fill="#f5d900"/>
    <path d="M 25 180 C 70 207 105 220 180 220 C 255 220 290 207 335 180 V 330 H 25 Z" fill="#54c900"/>
  </g>
  <circle cx="180" cy="180" r="110" fill="#fff" stroke="#d6d6d2" stroke-width="5"/>
  <circle cx="180" cy="180" r="101" fill="none" stroke="#f1f1ed" stroke-width="2"/>
  <!-- Circular brand lettering -->
  <text fill="#17150f" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" letter-spacing="7">
    <textPath href="#name-arc" startOffset="50%" text-anchor="middle">SULTANA</textPath>
  </text>
  <text fill="#17150f" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="6">
    <textPath href="#food-arc" startOffset="50%" text-anchor="middle">KÜNEFE</textPath>
  </text>
  <text x="180" y="112" text-anchor="middle" fill="#76b82a" font-family="Georgia, 'Times New Roman', serif" font-size="19">Gaziantep</text>
  <!-- Stylized S and K emblem -->
  <path d="M 169 143 C 143 122 112 139 112 165 C 112 187 131 197 158 199 C 180 201 196 194 199 180 C 202 165 186 157 166 151 C 149 146 136 148 130 157 C 123 168 132 179 146 184 C 160 189 177 187 190 180" fill="none" stroke="#4abd19" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 208 137 V 217 M 210 177 L 253 143 M 210 177 L 255 213" fill="none" stroke="#f2b900" stroke-width="18" stroke-linecap="butt" stroke-linejoin="miter"/>
  <text x="180" y="247" text-anchor="middle" fill="#111" font-family="Arial, sans-serif" font-size="16" font-weight="700">SİVAS</text>
</svg>
